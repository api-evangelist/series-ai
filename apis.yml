aid: series-ai
name: Series AI
description: >-
  Series AI (Series Entertainment, Inc.) is an a16z-backed, AI-native game
  company behind RUN.world, a platform to create, publish, play, and monetize
  HTML5 games. Series ships a real first-party developer surface: the RUN.world
  SDK (@series-inc/rundot-game-sdk) exposes a single RundotGameAPI for player
  storage, profiles, leaderboards, ad monetization, purchases, entitlements,
  multiplayer, server-authoritative simulation, and generative AI (image,
  audio, video, and text), while the rundot CLI scaffolds, deploys, versions,
  and operates live titles. StowKit asset tooling, a Three.js-based 3D engine
  with ECS, the Syncplay deterministic-multiplayer core, and a community
  workshop of game starters round out the toolchain. Founded by veterans from
  Riot, Epic, Blizzard, Pocket Gems, and Telltale.
