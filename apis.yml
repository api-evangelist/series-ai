apis:
- name: RUN.world SDK
  description: >-
    Client-side JavaScript/TypeScript SDK (@series-inc/rundot-game-sdk) that
    gives an HTML5 game access to RUN.world platform services through a single
    RundotGameAPI import: storage scopes, profiles, leaderboards, ads,
    purchases, entitlements, multiplayer, server-authoritative simulation, and
    generative AI. Calls cross a React Native JS bridge; failures surface as
    RundotApiError / RateLimitedError.
